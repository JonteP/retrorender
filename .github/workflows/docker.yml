# Runs the tests on every pull request and push to main. On main (and v* tags) the
# Docker image is then built and published to GitHub Container Registry as
# ghcr.io/<owner>/retrorender. Pull requests build the image without publishing it,
# so a broken Dockerfile shows up before merging.
# Tags: "latest" for main, the commit SHA, and "vX.Y.Z" for git tags.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # same as the Debian bookworm image
      - name: Libraries used by the engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgme0 libopenmpt0
          pip install numpy
      - name: Tests
        run: |
          python tests/test_txtp_titles.py
          python tests/test_jaudio.py
          python tests/test_outputs.py
      - name: Compile all modules
        run: python -m compileall -q app tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/retrorender
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern=v{{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
