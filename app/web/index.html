<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>retrorender</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23f2b84b%27/%3E%3Cpath d=%27M5 4v8l7-4z%27 fill=%27%23111418%27/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #111418; --panel: #191d23; --panel2: #20252c; --line: #2c323b;
    --text: #e6e8eb; --muted: #8b939e; --accent: #f2b84b; --accent2: #6fd3a7;
    --bad: #f07167; --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  a.link { color: var(--accent); }
  a.link:hover { text-decoration: underline; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 24px;
    padding: 12px 24px; background: rgba(17,20,24,.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line); }
  .logo { font-family: var(--mono); font-weight: 700; letter-spacing: .5px; }
  .logo span { color: var(--accent); }
  nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); }
  nav a.on, nav a:hover { color: var(--text); background: var(--panel2); }
  header .ver { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  header .upd { margin-left: auto; padding: 3px 10px; border-radius: 99px; background: var(--accent); color: #1b1407;
    font-size: 12px; font-weight: 600; white-space: nowrap; cursor: help; }
  header .upd:not([hidden]) + .ver { margin-left: 12px; }
  main { padding: 24px; padding-bottom: 110px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .6px; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; }
  .stat { display: flex; justify-content: space-between; padding: 4px 0;
    border-bottom: 1px dashed var(--line); }
  .stat:last-child { border: 0; }
  .stat b { font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 2px 9px; border-radius: 99px; background: var(--panel2);
    border: 1px solid var(--line); font-size: 12px; }
  .chip.ok { border-color: #2f6b55; color: var(--accent2); }
  .chip.bad { border-color: #7a3b37; color: var(--bad); }
  .chip.warn { border-color: #6d5520; color: var(--accent); }
  a.button, label.button { text-decoration: none; display: inline-block; }
  button, a.button, label.button { font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button:hover, a.button:hover, label.button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: #1b1407; border-color: var(--accent);
    font-weight: 600; }
  button.danger { color: var(--bad); border-color: #7a3b37; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=number] { padding: 6px 8px; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; font: inherit; }
  input[type=search], input[type=text] { width: 100%; padding: 8px 12px; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  /* library */
  .lib { display: grid; grid-template-columns: 250px 1fr; gap: 24px; }
  .side { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 200px);
    overflow: auto; }
  .side h2 { margin-top: 18px; }
  .side a { display: flex; justify-content: space-between; padding: 4px 8px;
    border-radius: 6px; color: var(--muted); }
  .side a:hover, .side a.on { background: var(--panel2); color: var(--text); }
  .albums { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .album { display: block; }
  .cover { aspect-ratio: 1; border-radius: 8px; background: var(--panel2) center/cover;
    border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .cover .ph { font-family: var(--mono); color: var(--muted); font-size: 13px; text-align: center;
    padding: 12px; }
  .album .t { margin-top: 8px; font-weight: 600; line-height: 1.25; }
  .album .s { font-size: 12px; color: var(--muted); }
  .album:hover .cover { border-color: var(--accent); }
  /* album page */
  .ahead { display: grid; grid-template-columns: 200px 1fr; gap: 24px; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
    padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.playing td { color: var(--accent); }
  td.num { width: 40px; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.len { width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
  .play { width: 30px; height: 30px; padding: 0; border-radius: 50%; }
  textarea { width: 100%; min-height: 360px; resize: vertical; padding: 12px; color: var(--text);
    background: #0c0f12; border: 1px solid var(--line); border-radius: 8px;
    font: 12.5px/1.5 var(--mono); tab-size: 2; white-space: pre; overflow-x: auto; }
  .two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
  details summary { cursor: pointer; color: var(--muted); }
  /* player, toast, modal */
  .player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 16px;
    align-items: center; padding: 10px 24px; background: var(--panel);
    border-top: 1px solid var(--line); }
  .player .now { min-width: 0; flex: 0 1 380px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .player .prog { flex: 1; min-width: 120px; display: flex; gap: 10px; align-items: center;
    font: 12px var(--mono); color: var(--muted); }
  .player .pbar { flex: 1; height: 4px; border-radius: 2px; background: var(--panel2); overflow: hidden; }
  .player #pfill { height: 100%; width: 0; background: var(--accent); }
  .player .ctl { display: flex; gap: 6px; align-items: center; }
  .player .ctl button { padding: 4px 8px; min-width: 38px; font-size: 16px; line-height: 1.3; }
  .player .remote { flex: none; display: flex; gap: 12px; align-items: center; color: var(--muted); }
  .player select { padding: 7px 10px; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; font: inherit; max-width: 230px; }
  .player input[type=range] { width: 100px; accent-color: var(--accent); }
  .player [hidden] { display: none !important; }
  .toast { position: fixed; right: 24px; bottom: 80px; z-index: 9; padding: 10px 16px;
    border-radius: 8px; background: var(--panel2); border: 1px solid var(--line);
    opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { border-color: #7a3b37; color: var(--bad); }
  .modal { position: fixed; inset: 0; z-index: 10; display: none; place-items: center;
    background: rgba(0,0,0,.6); }
  .modal.show { display: grid; }
  .modal .box { width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; }
  .modal .box ul { max-height: 180px; overflow: auto; }
  .modal .box.wide { width: min(1000px, 94vw); max-height: 92vh; overflow: auto; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-all; }
  td input.ren { padding: 4px 8px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .tabs a { padding: 6px 12px; border-radius: 8px; background: var(--panel2);
    border: 1px solid var(--line); color: var(--muted); }
  .tabs a.on { color: var(--text); border-color: var(--accent); }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: var(--accent); }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { padding: 4px 10px; font-size: 13px; }
  .warnbox { border-left: 3px solid var(--bad); padding: 8px 12px; background: #231819;
    border-radius: 6px; margin: 12px 0; }
  /* queue, menus, playlists */
  .player .nowcover { width: 44px; height: 44px; flex: none; border-radius: 6px; background: var(--panel2) center/cover;
    border: 1px solid var(--line); cursor: pointer; }
  .player .now { cursor: pointer; }
  .player .ctl button.on { color: var(--accent); border-color: var(--accent); }
  .player .ctl .badge { font-size: 11px; color: var(--muted); margin-left: 2px; }
  .qpanel { position: fixed; right: 0; top: 57px; bottom: 65px; width: min(400px, 100vw); z-index: 7;
    background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,.35); }
  .qpanel[hidden] { display: none; }
  .qpanel .qhead { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .qpanel .qlist { flex: 1; overflow: auto; padding: 6px 0; }
  .qitem { display: grid; grid-template-columns: 18px 34px 1fr auto auto; gap: 10px; align-items: center;
    padding: 5px 12px; cursor: pointer; }
  .qitem:hover { background: var(--panel2); }
  .qitem.cur { background: #2a2418; }
  .qitem.cur .qt { color: var(--accent); }
  .qitem.past { opacity: .55; }
  .qitem.drop { box-shadow: inset 0 2px 0 var(--accent); }
  .qitem .grip { color: var(--muted); cursor: grab; text-align: center; }
  .qitem .thumb { width: 34px; height: 34px; border-radius: 4px; background: var(--panel2) center/cover;
    border: 1px solid var(--line); display: grid; place-items: center; font: 10px var(--mono); color: var(--muted); }
  .qitem .qt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qitem .qs { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qitem .x { padding: 2px 8px; border: 0; background: none; color: var(--muted); }
  .qitem .x:hover { color: var(--bad); }
  .menu { position: fixed; z-index: 11; min-width: 200px; padding: 6px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; }
  .menu button:hover { background: var(--panel); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .more { width: 30px; height: 30px; padding: 0; border-radius: 50%; border-color: transparent; background: none; color: var(--muted); }
  .more:hover { color: var(--text); }
  .cover { position: relative; }
  .cplay { position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; border-radius: 50%; padding: 0;
    background: var(--accent); color: #1b1407; border: 0; font-size: 15px; opacity: 0; transform: translateY(4px);
    transition: .15s; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  .album:hover .cplay, .cplay:focus { opacity: 1; transform: none; }
  @media (hover: none) { .cplay { opacity: .9; transform: none; } }
  .mosaic { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .mosaic div { background: center/cover; }
  .mosaic.one { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .side input[type=search] { margin-top: 6px; }
  .side .sub { padding-left: 20px; }
  .side details > summary { display: none; }
  @media (max-width: 860px) { .side details > summary { display: block; margin-top: 10px; } }
  select.sort { padding: 7px 10px; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; font: inherit; }
  tr[draggable] td:first-child { cursor: grab; }
  tr.disc td { padding-top: 18px; font-weight: 600; color: var(--accent); border-bottom: 1px solid var(--line); }
  .cstage { position: relative; display: inline-block; max-width: 100%; user-select: none; }
  .cstage img { display: block; max-width: 100%; max-height: 62vh; }
  .cbox { position: absolute; border: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgba(0,0,0,.55);
    cursor: move; touch-action: none; }
  .cbox[hidden] { display: none; }
  .cbox i { position: absolute; width: 14px; height: 14px; background: var(--accent); border-radius: 3px; }
  .cbox i[data-h=nw] { left: -1px; top: -1px; cursor: nwse-resize; }
  .cbox i[data-h=ne] { right: -1px; top: -1px; cursor: nesw-resize; }
  .cbox i[data-h=sw] { left: -1px; bottom: -1px; cursor: nesw-resize; }
  .cbox i[data-h=se] { right: -1px; bottom: -1px; cursor: nwse-resize; }
  .cstage { overflow: hidden; }
  .cprev { width: 180px; height: 180px; border-radius: 8px; border: 1px solid var(--line);
    background: repeating-conic-gradient(#222 0 25%, #2c2c2c 0 50%) 0 0 / 16px 16px; }
  .album.online .cover { position: relative; }
  .album.online .rcover { position: absolute; inset: 0; background: center/cover no-repeat; }
  body.covers-whole .album.online .rcover { background-size: contain; }
  .album.online .t { color: var(--muted); }
  .cloud { position: absolute; left: 8px; top: 6px; font-size: 18px; color: #fff; text-shadow: 0 1px 4px #000; }
  .badge-cache { color: var(--accent); }
  .cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 10px;
    max-height: 34vh; overflow: auto; }
  .cand { cursor: pointer; font-size: 12px; color: var(--muted); }
  .cand div { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2) center/contain no-repeat; }
  .cand:hover div { border-color: var(--accent); }
  body.covers-whole .cover, body.covers-whole .thumb, body.covers-whole .nowcover, body.covers-whole .mosaic div {
    background-size: contain; background-repeat: no-repeat; }
  .srclist { list-style: none; padding: 0; margin: 8px 0; max-width: 640px; }
  .srclist li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 6px; background: var(--panel2); }
  .srclist li .grow { flex: 1; }
  .srclist li button { padding: 2px 8px; }
  .opts label { display: block; margin: 4px 0; }
  tr.drop td { box-shadow: inset 0 2px 0 var(--accent); }
  @media (max-width: 860px) {
    .lib, .ahead, .two { grid-template-columns: 1fr; }
    .side { position: static; max-height: none; }
    header { gap: 12px; padding: 10px 14px; }
    header .ver { display: none; }
    nav a { padding: 6px 8px; }
    main { padding: 16px; padding-bottom: 120px; }
    .player { gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
    .player .nowcover { display: none !important; }
    .player .now { flex: 1 1 100%; }
    .qpanel { top: 0; bottom: 105px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">retro<span>render</span></div>
  <nav>
    <a href="#/" data-nav="overview">Overview</a>
    <a href="#/library" data-nav="library">Library</a>
    <a href="#/playlists" data-nav="playlists">Playlists</a>
    <a href="#/settings" data-nav="settings">Settings</a>
    <a href="#/catalog" data-nav="catalog">Catalog</a>
  </nav>
  <span class="upd" id="upd" hidden></span>
  <div class="ver" id="ver"></div>
</header>
<main id="view"><p class="muted">Loading…</p></main>

<div class="player">
  <div class="nowcover" id="nowcover" hidden></div>
  <div class="now" id="now" title="Go to the album"><span class="muted">Not playing</span></div>
  <div class="ctl">
    <button id="pShuffle" title="Shuffle the rest of the queue">🔀</button>
    <button id="pPrev" title="Previous">⏮</button>
    <button id="pToggle" title="Play / pause (space)">▶</button>
    <button id="pNext" title="Next">⏭</button>
    <button id="pRepeat" title="Repeat: off">🔁</button>
    <button id="pQueue" title="Queue">☰<span class="badge" id="qcount"></span></button>
  </div>
  <audio id="audio" preload="none"></audio>
  <div class="prog"><span id="tCur">0:00</span><div class="pbar"><div id="pfill"></div></div><span id="tDur">0:00</span></div>
  <div class="remote" id="remote" hidden>
    <span id="rState"></span>
    <button id="pStop" title="Stop">⏹</button>
  </div>
  <input type="range" id="vol" min="0" max="100" step="1" title="Volume">
  <select id="target" title="Where to play">
    <option value="browser">This browser</option>
  </select>
</div>
<aside class="qpanel" id="qpanel" hidden></aside>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => { s = Math.round(s || 0); const m = Math.floor(s / 60);
  return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`
                 : `${m}:${String(s % 60).padStart(2, "0")}`; };
const initials = (t) => (t || "?").replace(/\([^)]*\)|\[[^\]]*\]/g, " ").split(/\s+/)
  .filter((w) => /^[\p{L}\p{N}]/u.test(w)).slice(0, 3).map((w) => w[0]).join("").toUpperCase() || "?";

async function api(path, opts = {}) {
  const r = await fetch("/api/" + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => (t.className = "toast"), 3500);
}
function modal(html, wide = false) {
  $("#modalbox").innerHTML = html; $("#modalbox").classList.toggle("wide", wide); $("#modal").classList.add("show");
}
function closeModal() { $("#modal").classList.remove("show"); }
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); closeMenu(); } });

// --- player: a queue, played in this browser or on a Cast/DLNA device ---------------------
// A track is the object the API returns (song_brief): id, title, artist, album, album_id,
// platform, cover, duration, render. The queue is kept in localStorage, so it survives a reload.
let queue = [], qi = 0, repeat = "off", shuffled = false, playingId = null;
let devices = [], remotePoll = null, target = "browser";
const store = {
  get(k, d) { try { const v = localStorage.getItem("retro." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("retro." + k, JSON.stringify(v)); } catch (e) { /* no storage */ } },
};
target = store.get("target", "browser");
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}) });
// rev changes with the cover, so the browser fetches a new one instead of reusing it
const coverUrl = (albumId, rev = "") => `/api/cover/${albumId}${rev ? "?v=" + rev : ""}`;
const isRemote = () => target !== "browser";

function saveQueue() { store.set("queue", { queue, qi, repeat, shuffled }); }
function restoreQueue() {
  const q = store.get("queue", null);
  if (!q || !Array.isArray(q.queue)) return;
  queue = q.queue; qi = Math.min(q.qi || 0, Math.max(0, queue.length - 1));
  repeat = q.repeat || "off"; shuffled = !!q.shuffled;
  if (queue[qi] && !isRemote()) { $("#audio").src = queue[qi].render; showProgress(0, queue[qi].duration); }
  setNow(queue[qi]);
}
function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function setNow(t, extra = "") {
  playingId = t ? t.id : null;
  $("#now").innerHTML = t
    ? `<b>${esc(t.title)}</b> <span class="muted">· ${esc([t.album, t.platform].filter(Boolean).join(" · "))}${extra}</span>`
    : `<span class="muted">Not playing</span>`;
  const c = $("#nowcover");
  c.hidden = !(t && t.cover);
  if (t && t.cover) c.style.backgroundImage = `url('${coverUrl(t.album_id, t.cover_rev)}')`;
  document.querySelectorAll("[data-id]").forEach((r) => r.classList.toggle("playing", r.dataset.id === playingId));
  if ("mediaSession" in navigator && t) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album,
        artwork: t.cover ? [{ src: coverUrl(t.album_id, t.cover_rev) }] : [] });
    } catch (e) { /* older browsers */ }
  }
  showControls();
}
function showControls() {
  $("#pShuffle").classList.toggle("on", shuffled);
  $("#pRepeat").classList.toggle("on", repeat !== "off");
  $("#pRepeat").textContent = repeat === "one" ? "🔂" : "🔁";
  $("#pRepeat").title = "Repeat: " + { off: "off", all: "the whole queue", one: "this track" }[repeat];
  $("#qcount").textContent = queue.length ? queue.length : "";
  if (!$("#qpanel").hidden) renderQueue();
}

// queue operations; every change is saved and, when a device plays, sent to it
function changed(restart = false) {
  saveQueue(); showControls();
  if (isRemote()) return restart ? startRemote() : sendQueue();
  if (restart) startLocal();
}
function playList(list, start = 0) {
  if (!list || !list.length) return toast("Nothing to play", true);
  queue = list.slice(); qi = Math.max(0, Math.min(start, queue.length - 1));
  if (shuffled) { const first = queue.splice(qi, 1)[0]; queue = [first, ...shuffleArr(queue)]; qi = 0; }
  changed(true);
}
function play(t, list) { const l = list && list.length ? list : [t]; playList(l, Math.max(0, l.indexOf(t))); }
function playNext(tracks) {
  if (!queue.length) return playList(tracks);
  queue.splice(qi + 1, 0, ...tracks); changed();
  toast(tracks.length === 1 ? `“${tracks[0].title}” plays next` : `${tracks.length} tracks play next`);
}
function enqueue(tracks) {
  if (!queue.length) return playList(tracks);
  queue.push(...tracks); changed();
  toast(tracks.length === 1 ? `Added “${tracks[0].title}” to the queue` : `Added ${tracks.length} tracks to the queue`);
}
function jump(i) {
  if (i < 0 || i >= queue.length) return;
  qi = i; saveQueue();
  if (isRemote()) return remote("goto", i);
  startLocal();
}
function removeAt(i) {
  const cur = i === qi;
  queue.splice(i, 1);
  if (i < qi) qi--;
  qi = Math.min(qi, Math.max(0, queue.length - 1));
  if (!queue.length) { stopAll(); return; }
  changed(cur);
}
function moveItem(from, to) {
  if (from === to) return;
  const [t] = queue.splice(from, 1);
  queue.splice(to > from ? to - 1 : to, 0, t);
  if (qi === from) qi = to > from ? to - 1 : to;
  else if (from < qi && to > qi) qi--;
  else if (from > qi && to <= qi) qi++;
  changed();
}
function clearQueue() {
  const cur = queue[qi];
  queue = cur ? [cur] : []; qi = 0; changed();
}
function stopAll() {
  queue = []; qi = 0; saveQueue();
  if (isRemote()) remote("stop"); else { $("#audio").pause(); $("#audio").removeAttribute("src"); }
  setNow(null);
}
function step(dir) {
  let n = qi + dir;
  if (repeat === "all" && queue.length) n = (n + queue.length) % queue.length;
  if (n < 0 || n >= queue.length) return false;
  jump(n); return true;
}
function toggleShuffle() {
  shuffled = !shuffled;
  // only the tracks after the current one are shuffled; turning it off keeps the order
  if (shuffled && queue.length > qi + 2) queue = [...queue.slice(0, qi + 1), ...shuffleArr(queue.slice(qi + 1))];
  changed();
  toast(shuffled ? "Shuffle on" : "Shuffle off");
}
function cycleRepeat() {
  repeat = { off: "all", all: "one", one: "off" }[repeat];
  saveQueue(); showControls();
  if (isRemote()) remote("repeat", repeat);
}

// this browser
function startLocal() {
  const a = $("#audio"), t = queue[qi];
  if (!t) return;
  a.src = t.render; a.play().catch(() => {});
  setNow(t);
}
// a track that cannot start: ask the server why instead of skipping on in silence
$("#audio").addEventListener("error", async () => {
  const t = queue[qi];
  if (isRemote() || !t || !$("#audio").src) return;
  let msg = "could not be played";
  try {
    const ctl = new AbortController();
    const r = await fetch(t.render, { signal: ctl.signal });
    if (!r.ok) msg = (await r.json().catch(() => ({}))).error || msg;
    ctl.abort();
  } catch (e) { /* aborted or offline */ }
  toast(`“${t.title}”: ${msg}`, true);
});
$("#audio").addEventListener("ended", () => {
  if (isRemote()) return;
  if (repeat === "one") { const a = $("#audio"); a.currentTime = 0; return a.play().catch(() => {}); }
  step(1);
});

// a device: the server keeps its queue; we send changes and follow its state
async function startRemote() {
  try {
    await post(`outputs/${encodeURIComponent(target)}/play`, { songs: queue.map((t) => t.id), start: qi, repeat });
    setNow(queue[qi], " · starting…");
    pollRemote();
  } catch (e) { toast(e.message, true); }
}
let sendTimer = null;
function sendQueue() {            // several quick edits (dragging) become one request
  clearTimeout(sendTimer);
  sendTimer = setTimeout(async () => {
    if (!queue.length) return;
    try { await post(`outputs/${encodeURIComponent(target)}/queue`, { songs: queue.map((t) => t.id), index: qi }); }
    catch (e) { toast(e.message, true); }
  }, 300);
}
async function remote(action, value) {
  try { await post(`outputs/${encodeURIComponent(target)}/${action}`, { value }); pollRemote(); }
  catch (e) { toast(e.message, true); }
}

$("#pPrev").onclick = () => {

};
$("#pNext").onclick = () => step(1);
$("#pToggle").onclick = () => {

$("#pShuffle").onclick = toggleShuffle;
$("#pRepeat").onclick = cycleRepeat;
$("#pStop").onclick = () => remote("stop");
// one volume slider: the browser's own, or the device's
$("#vol").value = Math.round(store.get("volume", 1) * 100);
$("#audio").volume = store.get("volume", 1);
$("#vol").oninput = (e) => { if (!isRemote()) { $("#audio").volume = e.target.value / 100; store.set("volume", e.target.value / 100); } };

// progress: from the audio element, or estimated between polls of the device
let rPos = null;               // {pos, at, playing, dur} from the last poll
function showProgress(cur, dur) {
  $("#tCur").textContent = fmt(cur || 0);
  $("#tDur").textContent = fmt(dur || 0);

}
function showPlaying(on) { $("#pToggle").textContent = on ? "⏸" : "▶"; }
const audioEl = $("#audio");
audioEl.addEventListener("timeupdate", () => { if (!isRemote()) showProgress(audioEl.currentTime, queue[qi]?.duration || audioEl.duration); });
audioEl.addEventListener("play", () => { if (!isRemote()) showPlaying(true); });
audioEl.addEventListener("pause", () => { if (!isRemote()) showPlaying(false); });
setInterval(() => {
  if (!isRemote() || !rPos) return;
  const cur = rPos.pos + (rPos.playing ? (Date.now() - rPos.at) / 1000 : 0);
  showProgress(Math.min(cur, rPos.dur || cur), rPos.dur);

$("#pQueue").onclick = () => { const p = $("#qpanel"); p.hidden = !p.hidden; if (!p.hidden) renderQueue(); };

if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("nexttrack", () => step(1));

}

function renderQueue() {
  const p = $("#qpanel");
  const total = queue.reduce((n, t) => n + (t.duration || 0), 0);
  const left = queue.slice(qi).reduce((n, t) => n + (t.duration || 0), 0);
  p.innerHTML = `<div class="qhead">
      <div class="row" style="justify-content:space-between"><h1 style="font-size:18px;margin:0">Queue</h1>
        <button id="qClose" title="Close">✕</button></div>
      <div class="muted">${queue.length} tracks · ${fmt(total)}${queue.length ? ` · ${fmt(left)} left` : ""}</div>
      <div class="row" style="margin-top:10px">
        <button id="qSave" ${queue.length ? "" : "disabled"}>Save as playlist…</button>
        <button id="qClear" ${queue.length > 1 ? "" : "disabled"} title="Remove everything except the current track">Clear</button></div>
    </div>
    <div class="qlist">${queue.map((t, i) => `<div class="qitem ${i === qi ? "cur" : i < qi ? "past" : ""}" draggable="true" data-i="${i}">
        <span class="grip" title="Drag to move">⋮⋮</span>
        <div class="thumb" ${t.cover ? `style="background-image:url('${coverUrl(t.album_id, t.cover_rev)}')"` : ""}>${t.cover ? "" : esc(initials(t.album))}</div>
        <div style="min-width:0"><div class="qt">${esc(t.title)}</div><div class="qs">${esc(t.album)} · ${esc(t.artist)}</div></div>
        <span class="muted mono">${fmt(t.duration)}</span>
        <button class="x" data-rm="${i}" title="Remove from the queue">✕</button></div>`).join("")
      || `<p class="muted" style="padding:0 16px">Empty. Use ▶ or “Add to queue” anywhere in the library.</p>`}</div>`;
  $("#qClose").onclick = () => (p.hidden = true);
  $("#qClear").onclick = clearQueue;
  $("#qSave").onclick = () => pickPlaylist(queue.slice(), true);
  p.querySelectorAll(".qitem").forEach((el) => {
    const i = +el.dataset.i;
    el.onclick = (e) => { if (e.target.dataset.rm != null) return removeAt(+e.target.dataset.rm); jump(i); };
  });
  dragSort(p.querySelector(".qlist"), ".qitem", moveItem);
  const cur = p.querySelector(".qitem.cur");
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

// drag to reorder: calls move(from, to) where `to` is the index the item is dropped before
function dragSort(container, sel, move) {
  if (!container) return;
  let from = null;
  container.querySelectorAll(sel).forEach((el) => {
    el.addEventListener("dragstart", (e) => { from = +el.dataset.i; e.dataTransfer.effectAllowed = "move"; });
    el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("drop"); });
    el.addEventListener("dragleave", () => el.classList.remove("drop"));
    el.addEventListener("drop", (e) => {
      e.preventDefault(); el.classList.remove("drop");
      if (from != null) move(from, +el.dataset.i);
      from = null;
    });
  });
  container.addEventListener("dragover", (e) => e.preventDefault());
  container.addEventListener("drop", (e) => {       // dropped below the last item
    if (from != null && e.target === container) move(from, container.querySelectorAll(sel).length);
    from = null;
  });
}

function menu(ev, items, anchor = null) {

  m.innerHTML = items.map((it, i) => it === "-" ? "<hr>" : `<button data-i="${i}">${esc(it[0])}</button>`).join("");
  document.body.appendChild(m);
  const r = (anchor || ev.currentTarget).getBoundingClientRect();
  const x = Math.min(r.left, innerWidth - m.offsetWidth - 8), y = r.bottom + m.offsetHeight > innerHeight - 70
    ? r.top - m.offsetHeight - 4 : r.bottom + 4;
  m.style.left = Math.max(8, x) + "px"; m.style.top = Math.max(8, y) + "px";
  m.onclick = (e) => { const b = e.target.closest("button"); if (b) { closeMenu(); items[+b.dataset.i][1](); } };
}
function closeMenu() { const m = $("#menu"); if (m) m.remove(); }

// menu items for a list of tracks; `get` may be async (fetching an album's tracks first)
function trackItems(get, one) {
  const run = (fn) => async () => { try { const t = await get(); fn(t); } catch (e) { toast(e.message, true); } };
  const items = [["▶ Play now", run((t) => playList(t))], ["Play next", run(playNext)], ["Add to queue", run(enqueue)],
    ["Add to playlist…", run((t) => pickPlaylist(t))]];
  if (one) {
    items.push("-", ["Rename…", () => renameTrack(one)], ["Info…", () => trackInfo(one)]);
    items.push("-", ["Go to album", () => (location.hash = "#/album/" + one.album_id)]);
    (one.artists || []).slice(0, 3).forEach((a) => items.push([`Go to ${a.name}`, () => (location.hash = "#/library?artist=" + a.id)]));
  }
  return items;
}

// rename in place: the title cell becomes a text field (Enter saves, Esc cancels)
function renameTrack(t) {
  const cell = document.querySelector(`tr[data-id="${t.id}"] .ttl`);
  const save = async (title) => {
    title = title.trim();
    if (!title || title === t.title) return false;
    try {
      await post(`song/${t.id}/title`, { title });
      t.title = title;
      queue.forEach((x) => { if (x.id === t.id) x.title = title; });
      saveQueue(); if (playingId === t.id) setNow(t);
      toast("Renamed");
      return true;
    } catch (e) { toast(e.message, true); return false; }
  };
  if (!cell) {                     // not in a table on this page (e.g. from the queue)
    modal(`<h1>Rename track</h1><input type="text" id="renIn" value="${esc(t.title)}">
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="closeModal()">Cancel</button>
        <button class="primary" id="go">Save</button></div>`);
    const go = async () => { await save($("#renIn").value); closeModal(); if (!$("#qpanel").hidden) renderQueue(); };
    $("#go").onclick = go; $("#renIn").onkeydown = (e) => { if (e.key === "Enter") go(); };
    $("#renIn").select();
    return;
  }
  cell.innerHTML = `<input type="text" class="ren" value="${esc(t.title)}">`;
  const inp = cell.querySelector("input");
  let done = false;
  const finish = async (keep) => {
    if (done) return; done = true;
    if (keep) await save(inp.value);
    cell.textContent = t.title;
  };
  inp.onkeydown = (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
  inp.onblur = () => finish(true);
  inp.ondblclick = (e) => e.stopPropagation();
  inp.focus(); inp.select();
}

async function loadDevices(rediscover = false) {
  try {
    const r = rediscover ? await post("outputs/discover") : await api("outputs");
    devices = r.devices || [];
  } catch (e) { devices = []; }
  const sel = $("#target");
  sel.innerHTML = `<option value="browser">This browser</option>` +
    devices.map((d) => `<option value="${esc(d.id)}">${esc(d.name)} (${d.kind === "cast" ? "Cast" : "DLNA"})</option>`).join("") +
    `<option value="__rescan">Search for devices…</option>`;
  if (isRemote() && !devices.some((d) => d.id === target)) target = "browser";
  sel.value = target;
  showTarget();
}
function showTarget() {
  $("#remote").hidden = !isRemote();
  rPos = null; showProgress(0, 0); showPlaying(isRemote() ? false : !audioEl.paused);
  clearInterval(remotePoll);
  if (isRemote()) { pollRemote(); remotePoll = setInterval(pollRemote, 2500); }
}
$("#target").onchange = async (e) => {
  if (e.target.value === "__rescan") {
    toast("Searching the network…");
    await loadDevices(true);
    return toast(`${devices.length} device(s) found`);
  }
  const was = isRemote();
  target = e.target.value;
  store.set("target", target);
  const a = $("#audio");
  if (isRemote() && !was && !a.paused && queue.length) { a.pause(); startRemote(); }   // move the music over
  else if (isRemote()) a.pause();
  showTarget();
};
async function pollRemote() {
  if (!isRemote() || document.hidden) return;
  try { devices = (await api("outputs")).devices || devices; } catch (e) { return; }
  const d = devices.find((x) => x.id === target), s = d && d.session;
  if (!s || !s.song) { $("#rState").textContent = d ? "Idle" : "Device gone"; rPos = null; showPlaying(false); return; }
  showPlaying(s.state === "PLAYING" || s.state === "BUFFERING");
  rPos = { pos: s.position || 0, at: Date.now(), playing: s.state === "PLAYING", dur: s.song.duration };
  const st = { PLAYING: "Playing", PAUSED: "Paused", BUFFERING: "Loading", STOPPED: "Stopped", IDLE: "Waiting" }[s.state] || s.state || "";
  $("#rState").textContent = (s.error || st) + ` · ${s.index + 1}/${s.count}`;
  // follow the device through our queue when it is the same queue
  if (s.songs && s.songs.length === queue.length && s.songs.every((id, i) => queue[i].id === id) && s.index !== qi) {
    qi = s.index; saveQueue();
  }
  const t = queue.find((x) => x.id === s.song.id) || { id: s.song.id, title: s.song.title, album: s.song.artist, album_id: s.song.album_id };
  if (playingId !== t.id || !$("#qpanel").hidden) setNow(t);
}

// --- router ---------------------------------------------------------------------------------
function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [path, qs] = h.split("?");
  return { parts: path.split("/").filter(Boolean), q: new URLSearchParams(qs || "") };
}
// Each tab remembers where you were (an album, filters, a playlist) and the scroll position,
// so going to Settings and back to Library lands on the same album. Clicking the tab you
// are already on goes to its start.
const SECTION = { library: "library", album: "library", online: "library", playlists: "playlists", playlist: "playlists" };
const lastHash = {}, scrollAt = {};
let curHash = location.hash;
document.querySelector("nav").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-nav]");
  if (!a) return;
  const sec = a.dataset.nav, here = SECTION[(parseHash().parts[0] || "")];
  if (sec !== here && lastHash[sec] && lastHash[sec] !== location.hash) { e.preventDefault(); location.hash = lastHash[sec]; }
});
async function route() {
  const { parts, q } = parseHash();
  const page = parts[0] || "overview";
  scrollAt[curHash] = window.scrollY;
  curHash = location.hash;
  if (SECTION[page]) lastHash[SECTION[page]] = location.hash;
  document.querySelectorAll("nav a").forEach((a) =>
    a.classList.toggle("on", a.dataset.nav === ({ album: "library", online: "library", playlist: "playlists" }[page] || page)));
  const v = $("#view");
  try {
    if (page === "library") await viewLibrary(v, q);
    else if (page === "album") await viewAlbum(v, parts[1]);
    else if (page === "online") await viewOnline(v, parts[1]);
    else if (page === "playlists") await viewPlaylists(v);
    else if (page === "playlist") await viewPlaylist(v, parts[1]);
    else if (page === "catalog") await viewCatalog(v);
    else if (page === "joshw") { location.replace("#/settings"); return; }
    else if (page === "settings") await viewSettings(v);
    else await viewOverview(v);
  } catch (e) { v.innerHTML = `<div class="card"><b>Error:</b> ${esc(e.message)}</div>`; }
  if (location.hash === curHash) window.scrollTo(0, scrollAt[curHash] || 0);
}

// download an online album, then play it (or just keep it: pin)
async function playOnline(rid, { pin = false, play = true } = {}) {
  let r;
  try { r = await post(`online/${rid}/fetch${pin ? "?pin=1" : ""}`); } catch (e) { return toast(e.message, true); }
  const name = r.title || r.name;
  let waited = 0;
  for (let i = 0; i < 1800; i++) {                 // up to an hour for a big rip
    if (r.albums && r.albums.length) {
      if (play) playList(await albumTracks(r.albums[0].id));
      else toast(`“${name}” is in the library`);
      if (location.hash === `#/online/${rid}`) location.hash = "#/album/" + r.albums[0].id;
      return;
    }
    if (r.online.state === "error") return toast(`Download failed: ${r.online.error || ""}`, true);
    if (r.unplayable && ["temporary", "pinned"].includes(r.online.state) && !r.progress) {
      toast(`“${name}” is downloaded, but no engine here plays ${r.unplayable.join(", ")} yet`, true);
      if (location.hash === `#/online/${rid}`) route();
      return;
    }
    if (["temporary", "pinned"].includes(r.online.state) && !r.progress && ++waited > 15)
      return toast(`“${name}” is downloaded, but no new album appeared: it may be the same as one you already have`, true);
    const p = r.progress;
    toast(p ? `${p.phase === "downloading" ? "Downloading" : p.phase === "unpacking" ? "Unpacking" : "Indexing"} “${name}”` +
      (p.phase === "downloading" && p.total ? ` · ${Math.round((100 * p.done) / p.total)}%` : "")
      : r.online.state === "queued" ? `“${name}” is next${r.listing ? ` (after: ${r.listing.replace(/^\S+ /, "")})` : ""}`
      : `Preparing “${name}”…`);
    await new Promise((res) => setTimeout(res, 2000));
    try { r = await api(`online/${rid}`); } catch (e) { /* try again */ }
  }
}

    </div>

  $("#aShuffle").onclick = () => playList(shuffleArr(a.tracks.slice()));

  $("#aMore").onclick = (e) => menu(e, [...trackItems(() => a.tracks).filter((_, i) => i === 1 || i === 3), "-",
    ["Edit cover…", () => editCover(a)],

    ...a.parts.map((p, i) => [`Export !tags.m3u${a.parts.length > 1 ? ` (${p.label || "part " + (i + 1)})` : ""}`,
      () => { location.href = `/api/album/${a.id}/tags.m3u?part=${i}`; }]),
    ["Regenerate album.toml…", () => regenerateAlbum(a)],
    ...(a.online ? ["-", ["Remove the download…", async () => {
      if (!confirm(`Remove “${a.name}” from the library? It stays in the online library and can be downloaded again.`)) return;
      try { await post(`online/${a.online.id}/remove`); toast("Removed"); location.hash = "#/library"; } catch (e) { toast(e.message, true); }
    }]] : [])]);
  if ($("#coverEdit")) $("#coverEdit").onclick = () => editCover(a);

  };

// album.toml and the title map, opened from the album's ⋯ menu. An album made of parts
// (e.g. streamed + sequenced) has one file per part; a selector switches between them.
function partSelect(a, i, fn) {
  if (a.parts.length < 2) return "";
  setTimeout(() => { const s = $("#partSel"); if (s) s.onchange = () => fn(a, +s.value); });
  return `<select class="sort" id="partSel" title="Part of the album">${a.parts.map((p, n) =>
    `<option value="${n}" ${n === i ? "selected" : ""}>${esc(p.label || "Part " + (n + 1))} · ${p.songs} tracks</option>`).join("")}</select>`;
}
function editToml(a, i = 0) {

    legacy: ["warn", "older version"], missing: ["bad", "missing"] }[p.toml_state];
  modal(`<div class="row" style="justify-content:space-between"><h1>album.toml</h1>
      <div class="row">${partSelect(a, i, editToml)}<span class="chip ${stateChip[0]}">${stateChip[1]}</span></div></div>
    <p class="mono muted">${esc(p.toml_path || "")}</p>

function editTitles(a, i = 0) {

      Titles here (per internal file name) win over the rip's own !tags.m3u, ${p.titles_builtin ? "the built-in map, " : ""}tags and file names.

  $("#saveTitles").onclick = async () => {
    try {
      const r = await api(`album/${a.id}/titles?part=${i}`, { method: "POST", headers: { "Content-Type": "text/plain; charset=utf-8" },
        body: $("#titles").value });

    } catch (e) { toast(e.message, true); }

function regenerateAlbum(a, i = 0) {
  const p = a.parts[i];
  modal(`<div class="row" style="justify-content:space-between"><h1>Regenerate album.toml?</h1>${partSelect(a, i, regenerateAlbum)}</div>
    <p>A fresh file is generated from tags, playlists, your title map and file names.</p>
    ${p.toml_state === "edited" || p.toml_state === "legacy" ? `<div class="warnbox">This file has been edited.
      Your version is moved to <span class="mono">/meta/.backup/</span> and stops applying.</div>` : ""}
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button onclick="closeModal()">Cancel</button><button class="danger" id="go">Regenerate</button></div>`);
  $("#go").onclick = async () => {
    try { await api(`album/${a.id}/regenerate?part=${i}`, { method: "POST" }); closeModal();

    } catch (e) { closeModal(); toast(e.message, true); }

// --- cover editor ---------------------------------------------------------------------------
// Crop any part of an image, optionally padded to a square. The image comes from you
// ("Choose image…", kept in /meta to crop from again), from a source (libretro-thumbnails),
// or from the rip. The result is uploaded as the album's cover, so TVs and Subsonic apps get
// the same picture. The rip's own image is never changed.
const TYPE_LABEL = { boxart: "Box art", title: "Title screen", snap: "Screenshot", logo: "Logo" };
async function editCover(a) {
  const img = new Image();
  let settings = { covers: { shape: "crop", libretro_type: "boxart", enabled: [] } };
  try { settings = await api("settings"); } catch (e) { /* defaults */ }
  const cs = settings.covers;
  let square = cs.shape !== "pad", pad = true, box = null;          // box: crop rect in image pixels
  const src = a.cover_source || a.rip_cover ? `${coverUrl(a.id)}?original=1&t=${Date.now()}` : a.cover ? coverUrl(a.id) : null;
  const info = a.cover_info;
  const origin = { upload: "your own cover", toml: "album.toml", rip: "the rip's own image",
    libretro: info ? `libretro-thumbnails · ${TYPE_LABEL[info.type] || info.type} · ${info.name}` : "libretro-thumbnails" }[a.cover_origin];
  const useSources = cs.enabled.includes("libretro");
  modal(`<div class="row" style="justify-content:space-between"><div><h1>Cover</h1>
      <p class="muted" style="margin:0">${origin ? "Now: " + esc(origin) : "No cover yet."}</p></div>
      <label class="button">Choose image…<input type="file" id="cfile" accept="image/jpeg,image/png,image/webp" hidden></label></div>
    ${src ? `<div class="row" style="margin:12px 0">
        <label><input type="checkbox" id="csq" ${square ? "checked" : ""}> Square crop</label>
        <label id="padwrap"><input type="checkbox" id="cpad" checked> Pad to a square (shows all of the crop)</label>
        <button id="cwhole" style="padding:4px 10px">Whole image</button>
        <span class="muted" id="cinfo"></span></div>
      <div class="row" style="align-items:flex-start;gap:20px">
        <div class="cstage" id="cstage"><img id="cimg" alt=""><div class="cbox" id="cbox"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div>
        <div><div class="muted" style="margin-bottom:6px">Result</div><canvas id="cprev" width="180" height="180" class="cprev"></canvas></div>
      </div>`
      : `<p class="muted">This album has no image to crop. Choose one, or pick one below.</p>`}
    ${useSources ? `<h2 style="margin-top:20px">From libretro-thumbnails</h2>
      <div class="row">
        <select class="sort" id="ctype">${Object.entries(TYPE_LABEL).map(([k, l]) => `<option value="${k}" ${k === cs.libretro_type ? "selected" : ""}>${l}</option>`).join("")}</select>
        <select class="sort" id="cregion" title="Which release's cover this album gets">
          ${[["", "Release: automatic"], ["USA", "Release: USA"], ["Europe", "Release: Europe"], ["Japan", "Release: Japan"], ["World", "Release: World"], ["Korea", "Release: Korea"]]
            .map(([k, l]) => `<option value="${k}" ${(cs.album_regions || {})[a.key] === k || (!k && !(cs.album_regions || {})[a.key]) ? "selected" : ""}>${l}</option>`).join("")}</select>
        <input type="search" id="cq" placeholder="Search another name (Enter)" style="flex:1;min-width:200px">
        <span class="muted" id="cstat"></span></div>
      <div class="cands" id="cands"></div>` : ""}
    <div class="row" style="justify-content:space-between;margin-top:14px">
      <div class="row">${a.cover_uploaded ? `<button id="cdel">${a.rip_cover ? "Remove my cover" : "Remove cover"}</button>` : ""}
        ${a.cover_source ? `<button id="cforget" title="Delete the image you chose (the cover made from it goes too)">Forget my image</button>` : ""}</div>
      <div class="row"><button onclick="closeModal()">Cancel</button>
        <button class="primary" id="csave" ${src ? "" : "disabled"}>Save cover</button></div></div>`, true);
  const reopen = async () => { try { editCover(await api("album/" + a.id)); } catch (e) { toast(e.message, true); } };
  $("#cfile").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {            // keep the chosen image as it is (as JPEG/PNG), then crop from it
      const body = /image\/(jpeg|png)/.test(f.type) ? f : await new Promise((r) => {
        const i = new Image(); i.onload = () => { const c = document.createElement("canvas");
          c.width = i.naturalWidth; c.height = i.naturalHeight; c.getContext("2d").drawImage(i, 0, 0);
          c.toBlob(r, "image/png"); }; i.src = URL.createObjectURL(f); });
      await api(`album/${a.id}/cover?source=1`, { method: "POST", headers: { "Content-Type": body.type }, body });
      reopen();
    } catch (err) { toast(err.message, true); }
  };
  const remove = async (all) => {
    try {
      await api(`album/${a.id}/cover/delete${all ? "?all=1" : ""}`, { method: "POST" }); closeModal();
      toast(all ? "Your image and the cover made from it are removed" : "Your cover is removed");
      setTimeout(route, 800);
    } catch (err) { toast(err.message, true); }
  };
  if ($("#cdel")) $("#cdel").onclick = () => remove(false);
  if ($("#cforget")) $("#cforget").onclick = () => confirm("Delete the image you chose for this album?") && remove(true);

  // candidates from libretro-thumbnails: click to use as the cover, or to crop from
  const loadCands = async () => {
    const type = $("#ctype").value, qv = $("#cq").value.trim();
    $("#cstat").textContent = "Searching…"; $("#cands").innerHTML = "";
    try {
      const r = await api(`album/${a.id}/cover/candidates?type=${type}${qv ? "&q=" + encodeURIComponent(qv) : ""}`);
      $("#cstat").textContent = r.candidates.length ? "" : r.error ? r.error :
        r.systems && r.systems.length ? `Nothing found in ${r.systems.join(", ")}` : `libretro has no console matching “${a.platform}”`;
      $("#cands").innerHTML = r.candidates.map((c, i) => `<div class="cand" data-c="${i}" title="${esc(c.system)}">
        <div style="background-image:url('${c.url}')"></div>${esc(c.name)}</div>`).join("");
      $("#cands").querySelectorAll("[data-c]").forEach((el) => (el.onclick = (e) => {
        const c = r.candidates[+el.dataset.c];
        const pick = (use) => async () => {
          try {
            const res = await post(`album/${a.id}/cover/pick`, { system: c.system, path: c.path, type: c.type, use });
            if (use === "crop") return reopen();
            closeModal(); toast(res.note || "Cover saved"); route();
          } catch (err) { toast(err.message, true); }
        };
        menu(e, [["Use as cover", pick("cover")], ["Crop this…", pick("crop")]], el);
      }));
    } catch (err) { $("#cstat").textContent = err.message; }
  };
  if (useSources) {
    $("#cregion").onchange = async (e) => {
      $("#cstat").textContent = "Fetching…";
      try {
        const r = await post(`album/${a.id}/cover/region`, { region: e.target.value });
        const reg = e.target.value, hit = r.found && (!reg || r.info.name.includes(reg));
        toast(hit ? `Cover: ${r.info.name}` : `No ${reg} release under this name${r.found ? ` (using ${r.info.name})` : ""}. ` +
          "If it is called something else there, search for that name below and pick it.", !hit);
        reopen(); route();
      } catch (err) { toast(err.message, true); }
    };
    $("#ctype").onchange = loadCands;
    $("#cq").onkeydown = (e) => { if (e.key === "Enter") loadCands(); };
    loadCands();
  }
  if (!src) return;

  const el = $("#cimg"), cb = $("#cbox");
  const scale = () => el.clientWidth / img.naturalWidth;
  const clamp = () => {
    const W = img.naturalWidth, H = img.naturalHeight;
    box.w = Math.max(16, Math.min(box.w, W)); box.h = Math.max(16, Math.min(box.h, H));
    if (square) box.w = box.h = Math.min(box.w, box.h);
    box.x = Math.max(0, Math.min(box.x, W - box.w)); box.y = Math.max(0, Math.min(box.y, H - box.h));
  };
  // the cover as it will be saved: the crop, padded to a square over a blurred copy if wanted
  const render = (c, max) => {
    const g = c.getContext("2d"), padded = pad && Math.abs(box.w - box.h) > 1;
    const k = Math.min(1, max / Math.max(box.w, box.h));
    if (!padded) {
      c.width = Math.round(box.w * k); c.height = Math.round(box.h * k);
      g.drawImage(img, box.x, box.y, box.w, box.h, 0, 0, c.width, c.height);
      return;
    }
    const side = Math.round(Math.max(box.w, box.h) * k), kb = side / Math.min(box.w, box.h);
    c.width = c.height = side;
    g.filter = "blur(24px) brightness(0.55)";
    g.drawImage(img, box.x, box.y, box.w, box.h, (side - box.w * kb) / 2, (side - box.h * kb) / 2, box.w * kb, box.h * kb);
    g.filter = "none";
    g.drawImage(img, box.x, box.y, box.w, box.h, (side - box.w * k) / 2, (side - box.h * k) / 2, box.w * k, box.h * k);
  };
  let prevTimer = null;
  const draw = () => {
    const k = scale();
    Object.assign(cb.style, { left: box.x * k + "px", top: box.y * k + "px", width: box.w * k + "px", height: box.h * k + "px" });
    $("#padwrap").style.visibility = square ? "hidden" : "visible";
    $("#cinfo").textContent = `${Math.round(box.w)} × ${Math.round(box.h)} px`;
    clearTimeout(prevTimer);
    prevTimer = setTimeout(() => {
      const t = document.createElement("canvas"); render(t, 360);
      const p = $("#cprev"), g = p.getContext("2d");
      g.clearRect(0, 0, p.width, p.height);
      const k2 = Math.min(p.width / t.width, p.height / t.height);
      g.drawImage(t, (p.width - t.width * k2) / 2, (p.height - t.height * k2) / 2, t.width * k2, t.height * k2);
    }, 40);
  };
  img.onload = () => {
    el.src = img.src;
    const W = img.naturalWidth, H = img.naturalHeight, s = Math.min(W, H);
    if (!square) box = { x: 0, y: 0, w: W, h: H };          // the "pad" default: all of it
    // a wide image (e.g. a whole case scan): start with the right-hand square, the front
    else box = W > H * 1.3 ? { x: W - s, y: 0, w: s, h: s } : { x: (W - s) / 2, y: (H - s) / 2, w: s, h: s };
    el.onload = draw; if (el.complete) draw();
  };
  img.onerror = () => toast("Could not load the image", true);
  img.src = src;
  $("#csq").onchange = (e) => { square = e.target.checked; clamp(); draw(); };
  $("#cpad").onchange = (e) => { pad = e.target.checked; draw(); };
  $("#cwhole").onclick = () => {
    square = false; $("#csq").checked = false;
    box = { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight }; draw();
  };
  // drag the box to move it, drag a corner to resize
  let drag = null;
  cb.addEventListener("pointerdown", (e) => {
    e.preventDefault(); cb.setPointerCapture(e.pointerId);
    drag = { h: e.target.dataset.h || "move", x: e.clientX, y: e.clientY, b: { ...box } };
  });
  cb.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const k = scale(), dx = (e.clientX - drag.x) / k, dy = (e.clientY - drag.y) / k, b = drag.b;
    if (drag.h === "move") { box.x = b.x + dx; box.y = b.y + dy; }
    else {
      let w = b.w + (drag.h.includes("e") ? dx : -dx), h = b.h + (drag.h.includes("s") ? dy : -dy);
      if (square) w = h = Math.max(w, h);
      box = { x: drag.h.includes("w") ? b.x + b.w - w : b.x, y: drag.h.includes("n") ? b.y + b.h - h : b.y, w, h };
    }
    clamp(); draw();
  });
  cb.addEventListener("pointerup", () => (drag = null));
  window.addEventListener("resize", () => box && draw());
  $("#csave").onclick = async () => {
    const c = document.createElement("canvas");
    render(c, 1200);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.92));
    try {
      await api(`album/${a.id}/cover`, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
      closeModal(); toast("Cover saved"); route();
    } catch (err) { toast(err.message, true); }
  };
}

        <button data-dn="${i}" ${i < order.length - 1 ? "" : "disabled"} title="Lower priority">↓</button></li>`).join("");
    $("#srcs").querySelectorAll("[data-up]").forEach((b) => (b.onclick = () => { const i = +b.dataset.up; [order[i - 1], order[i]] = [order[i], order[i - 1]]; drawSrcs(); saveCovers(); }));
    $("#srcs").querySelectorAll("[data-dn]").forEach((b) => (b.onclick = () => { const i = +b.dataset.dn; [order[i + 1], order[i]] = [order[i], order[i + 1]]; drawSrcs(); saveCovers(); }));
    $("#srcs").querySelectorAll("[data-en]").forEach((b) => (b.onchange = () => {
      c.enabled = b.checked ? [...c.enabled, b.dataset.en] : c.enabled.filter((x) => x !== b.dataset.en);
      saveCovers();
    }));
  };
  // every change is saved at once (a short pause gathers quick clicks into one save)
  let coverTimer = null;
  const saveCovers = () => {
    clearTimeout(coverTimer);
    coverTimer = setTimeout(async () => {
      const body = { covers: { order, enabled: c.enabled, auto: $("#cauto").checked,
        libretro_type: document.querySelector("[name=ltype]:checked").value,
        shape: document.querySelector("[name=shape]:checked").value,
        regions: $("#cregions").value.split(",").map((x) => x.trim()).filter(Boolean) } };
      try {
        const r = await post("settings", body); showStatus(r.status); toast("Saved");
        document.body.classList.toggle("covers-whole", r.covers.shape === "original");
      } catch (e) { toast(e.message, true); }
    }, 400);
  };
  drawSrcs();
  document.querySelectorAll("[name=ltype], [name=shape]").forEach((r) => (r.onchange = saveCovers));
  $("#cauto").onchange = saveCovers;
  $("#cregions").onchange = saveCovers;
  const showStatus = (x) => {
    if (!x) return;
    $("#cstatus").textContent = x.running ? `Fetching… ${x.checked} of ${x.total} albums checked, ${x.found} found`
      : x.last_run ? `Last run ${x.last_run}: ${x.found} found, ${x.missing} not found${x.errors ? `, ${x.errors} errors (${x.last_error})` : ""}.`
      : "Not run yet.";
    const le = Object.entries(x.listing_errors || {});
    if (le.length) $("#cstatus").textContent += " Could not list: " + le.map(([k, v]) => `${k} (${v})`).join(", ");
  };
  showStatus(st);
  const poll = setInterval(async () => {
    if (!document.body.contains($("#cstatus"))) return clearInterval(poll);
    try { showStatus(await api("covers/status")); } catch (e) { /* later */ }
  }, 3000);
  const fetchNow = (retry) => async () => {
    try { const r = await post("covers/fetch", { retry }); showStatus(r.status); toast("Fetching covers in the background"); }
    catch (e) { toast(e.message, true); }
  };
  $("#cfetch").onclick = fetchNow(false);
  $("#cretry").onclick = () => confirm("Search again for every album? Covers fetched before may change; " +
    "covers you picked or made stay.") && fetchNow(true)();
  if (s.online && s.online.available) settingsOnline(s);
}

function settingsOnline(s) {
  const src = s.online.sources;
  const stat = (st) => {
    const by = {};
    for (const x of st.systems) by[x.source + "/" + x.system] = x;
    return by;
  };
  let by = stat(s.online.status);
  const draw = () => {
    $("#osrc").innerHTML = Object.entries(src).map(([k, c]) => `<div class="srclist"><li style="flex-wrap:wrap">
      <input type="checkbox" data-oen="${k}" ${c.enabled ? "checked" : ""}>
      <span class="grow"><b>${esc(c.label)}</b><div class="muted">${esc(c.description)}</div></span>
      <div style="flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 12px;margin-top:8px">
        ${Object.entries(c.known).map(([sys, name]) => {
          const x = by[k + "/" + sys];
          const info = x ? (x.error ? " · list failed" : x.refreshed ? ` · ${x.listed}` : " · not read yet") : "";
          const np = c.unplayable[sys];
          return `<label title="${esc(np ? "No engine here plays " + np.join(", ") + " yet" : x && x.error ? x.error : sys)}" ${np ? 'style="opacity:.55"' : ""}><input type="checkbox" data-osys="${k}/${sys}" ${c.systems.includes(sys) ? "checked" : ""}> ${esc(name)}<span class="muted">${np ? " · no player yet" : info}</span></label>`;
        }).join("")}</div></li></div>`).join("");
    $("#osrc").querySelectorAll("[data-oen]").forEach((b) => (b.onchange = () => { src[b.dataset.oen].enabled = b.checked; saveOnline(); }));
    $("#osrc").querySelectorAll("[data-osys]").forEach((b) => (b.onchange = () => {
      const [k, sys] = b.dataset.osys.split("/");
      const on = src[k].systems;
      src[k].systems = b.checked ? [...on, sys] : on.filter((x) => x !== sys);
      saveOnline(b.checked ? sys : null);
    }));
  };
  draw();
  const show = (st) => {
    $("#ostatus").textContent = st.current ? `Downloading ${st.current.name}…` :
      st.log && st.log.length ? st.log[st.log.length - 1] : "";
    $("#olog").textContent = (st.log || []).slice().reverse().join("\n");
  };
  show(s.online.status);
  const ago = (t) => {
    if (!t) return "never";
    const d = (Date.now() / 1000 - t) / 86400;
    return d < 1 ? "today" : d < 2 ? "yesterday" : `${Math.floor(d)} days ago`;
  };
  const mb = (b) => (b >= 1024 ** 3 ? (b / 1024 ** 3).toFixed(1) + " GB" : Math.max(1, Math.round(b / 1024 ** 2)) + " MB");
  const loadDownloads = async () => {
    const state = $("#dstate").value;
    const r = await api(`online/search?state=${state}&limit=500&sizes=1&order=played`);
    if (!$("#dcount")) return;                      // the page was left meanwhile
    $("#dcount").textContent = `${r.total} ${r.total === 1 ? "album" : "albums"}` +
      (state !== "error" ? ` · ${mb(r.rows.reduce((n, x) => n + (x.bytes || 0), 0))}` : "");
    $("#dlist").innerHTML = r.rows.length ? `<table><tbody>${r.rows.map((x) => `<tr>
        <td>${x.albums && x.albums.length ? `<a class="link" href="#/album/${x.albums[0].id}">${esc(x.title)}</a>` : esc(x.title)}
          <div class="muted">${esc(x.platform)}${state === "error" ? " · " + esc(x.error || "") : ""}</div></td>
        <td class="muted">${state === "error" ? esc(x.size || "") : mb(x.bytes || 0)}</td>
        <td class="muted">${state === "error" ? "" : "played " + ago(x.last_played)}</td>
        <td class="actions" style="white-space:nowrap">${
          state === "temporary" ? `<button data-a="pin" data-id="${x.id}">Keep</button> <button data-a="remove" data-id="${x.id}">Remove</button>`
          : state === "pinned" ? `<button data-a="unpin" data-id="${x.id}" title="Back to the cache: removed when it is full">Move to cache</button> <button data-a="remove" data-id="${x.id}">Remove</button>`
          : `<button data-a="fetch" data-id="${x.id}">Try again</button>`}</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted">Nothing here.</p>`;
    $("#dlist").querySelectorAll("[data-a]").forEach((b) => (b.onclick = async () => {
      const row = r.rows.find((x) => x.id === +b.dataset.id);
      if (b.dataset.a === "remove" && state === "pinned" && !confirm(`Remove “${row.title}” from the library? It stays in the online library.`)) return;
      try { await post(`online/${b.dataset.id}/${b.dataset.a}`); loadDownloads(); } catch (e) { toast(e.message, true); }
    }));
  };
  $("#dstate").onchange = loadDownloads;
  loadDownloads();
  const opoll = setInterval(async () => {
    if (!document.body.contains($("#ostatus"))) return clearInterval(opoll);
    try { show(await api("online/status")); } catch (e) { /* later */ }
  }, 4000);
  let onTimer = null, added = false;
  const saveOnline = (newSystem = null) => {
    added = added || !!newSystem;
    clearTimeout(onTimer);
    onTimer = setTimeout(async () => {
      const sources = {};
      for (const [k, c] of Object.entries(src)) sources[k] = { enabled: c.enabled, systems: c.systems };
      try {
        await post("settings", { online: { sources, temp_limit_gb: limit } });
        toast(added ? "Saved; the new lists are read in the background (a few minutes per console)" : "Saved");
        added = false;
      } catch (e) { toast(e.message, true); }
    }, 800);
  };
  // a smaller cache removes cached albums at once: ask first
  let limit = s.online.temp_limit_gb;
  $("#olimit").onchange = (e) => {
    const v = Math.max(0, +e.target.value), used = s.online.status.cache_gb;
    if (v < used && !confirm(`The cache holds ${used} GB. Lowering it to ${v} GB removes about ${(used - v).toFixed(1)} GB ` +
        "of cached albums now, least recently played first. Albums you added are kept. Continue?")) {
      e.target.value = limit; return;
    }
    limit = v; saveOnline();
  };
  $("#orefresh").onclick = async () => {
    const n = Object.values(src).reduce((a, c) => a + (c.enabled ? c.systems.length : 0), 0);
    if (!confirm(`Read the lists of ${n} ${n === 1 ? "console" : "consoles"} again? Each takes a few minutes, ` +
        "with a pause between requests so as not to load the site. Lists are also read by themselves once a day. " +
        "Downloads still go first.")) return;
    try { await post("online/refresh?force=1"); toast("Reading the lists in the background"); } catch (e) { toast(e.message, true); }
  };
}

// --- playlists ------------------------------------------------------------------------------
function mosaic(p) {
  const c = p.covers || [];
  if (!c.length) return `<div class="cover"><div class="ph">PLAYLIST<br><b>${esc(initials(p.name))}</b></div></div>`;
  const cells = c.length >= 4 ? c.slice(0, 4) : [c[0]];
  return `<div class="cover mosaic ${cells.length === 1 ? "one" : ""}">${cells.map((id) => `<div style="background-image:url('${coverUrl(id)}')"></div>`).join("")}</div>`;
}
async function viewPlaylists(v) {
  const r = await api("playlists");
  v.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <div><h1>Playlists</h1><span class="muted">${r.playlists.length} playlists · saved in <span class="mono">/meta/_playlists</span>, also visible to Subsonic apps</span></div>
      <button class="primary" id="plNew" ${r.writable ? "" : "disabled"}>New playlist</button></div>
    <div class="albums">${r.playlists.map((p) => `<a class="album" href="#/playlist/${p.id}">${mosaic(p)}
        <div class="t">${esc(p.name)}</div><div class="s">${p.songs} tracks · ${fmt(p.duration)}</div></a>`).join("")
      || `<p class="muted">No playlists yet. Make one here, or use “Add to playlist…” on any track, album or the queue.</p>`}</div>`;
  $("#plNew").onclick = () => {
    modal(`<h1>New playlist</h1><input type="text" id="plName" placeholder="Name">
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="closeModal()">Cancel</button>
        <button class="primary" id="go">Create</button></div>`);
    $("#plName").focus();
    const go = async () => {
      try { const p = await post("playlists", { name: $("#plName").value }); closeModal(); location.hash = "#/playlist/" + p.id; }
      catch (e) { toast(e.message, true); }
    };
    $("#go").onclick = go;
    $("#plName").onkeydown = (e) => { if (e.key === "Enter") go(); };
  };
}
async function viewPlaylist(v, id) {
  const p = await api("playlist/" + encodeURIComponent(id));
  const t = p.tracks;
  const save = async (body, msg) => {
    try { await post("playlist/" + p.id, body); if (msg) toast(msg); route(); }
    catch (e) { toast(e.message, true); }
  };
  v.innerHTML = `
    <div class="ahead">
      ${mosaic(p)}
      <div>
        <p class="muted" style="margin:0"><a class="link" href="#/playlists">Playlists</a></p>
        <h1 style="font-size:28px">${esc(p.name)}</h1>
        ${p.comment ? `<p>${esc(p.comment)}</p>` : ""}
        <div class="chips"><span class="chip">${p.songs} tracks · ${fmt(p.duration)}</span>
          ${p.missing ? `<span class="chip warn" title="Files that are no longer in the library. They stay in the playlist file.">${p.missing} missing</span>` : ""}</div>
        <div class="row" style="margin-top:16px">
          <button class="primary" id="pPlay" ${t.length ? "" : "disabled"}>▶ Play</button>
          <button id="pShuf" ${t.length ? "" : "disabled"}>🔀 Shuffle</button>
          <button id="pQ" ${t.length ? "" : "disabled"}>Add to queue</button>
          <span style="flex:1"></span>
          <button id="pRename" ${p.writable ? "" : "disabled"}>Rename…</button>
          <button class="danger" id="pDel" ${p.writable ? "" : "disabled"}>Delete</button>
        </div>
      </div>
    </div>
    <section class="card">${t.length ? trackTable(t, { album: true, drag: p.writable, remove: p.writable })
      : `<p class="muted">Empty. Use “Add to playlist…” on tracks and albums in the library.</p>`}
      ${t.length && p.writable ? `<p class="muted">Drag rows to change the order.</p>` : ""}</section>`;
  bindTracks(v, t);
  $("#pPlay").onclick = () => playList(t);
  $("#pShuf").onclick = () => playList(shuffleArr(t.slice()));
  $("#pQ").onclick = () => enqueue(t);
  v.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => {
    const ids = t.map((x) => x.id); ids.splice(+b.dataset.rm, 1); save({ songs: ids });
  }));
  dragSort(v.querySelector("tbody"), "tr[data-i]", (from, to) => {
    const ids = t.map((x) => x.id), [m] = ids.splice(from, 1);
    ids.splice(to > from ? to - 1 : to, 0, m); save({ songs: ids });
  });
  $("#pRename").onclick = () => {
    modal(`<h1>Rename playlist</h1><input type="text" id="plName" value="${esc(p.name)}">
      <p class="muted">Comment</p><input type="text" id="plComment" value="${esc(p.comment)}">
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="closeModal()">Cancel</button>
        <button class="primary" id="go">Save</button></div>`);
    $("#go").onclick = () => { closeModal(); save({ name: $("#plName").value, comment: $("#plComment").value }); };
  };
  $("#pDel").onclick = async () => {
    if (!confirm(`Delete the playlist “${p.name}”? The music itself is not touched.`)) return;
    try { await post(`playlist/${p.id}/delete`); toast("Playlist deleted"); location.hash = "#/playlists"; }
    catch (e) { toast(e.message, true); }
  };
}

// --- catalog --------------------------------------------------------------------------------
async function viewCatalog(v) {
  const c = await api("catalog");
  const editions = Object.entries(c.editions || {});
  v.innerHTML = `
    <h1>Catalog</h1>
    <p class="muted">${c.catalog.files ?? 0} files, ${c.catalog.hashed ?? 0} hashed${c.hashing ? " (hashing…)" : ""}.</p>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <section class="card"><h2>Hidden duplicates</h2>
        <p class="muted">Files with identical content are shown once. The first in alphabetical order is kept.</p>
        ${c.hidden_duplicates.length ? `<table><thead><tr><th>Hidden</th><th>Kept</th></tr></thead><tbody>
          ${c.hidden_duplicates.map((d) => `<tr><td class="mono">${esc(d.hidden)}</td><td class="mono muted">${esc(d.kept)}</td></tr>`).join("")}
          </tbody></table>` : `<p>None.</p>`}
      </section>
      <section class="card"><h2>Same game key</h2>
        <p class="muted">Albums that the catalog considers the same release (same console, title, region and sound chips).</p>
        ${editions.length ? editions.map(([k, names]) => `<div style="margin-bottom:8px"><div class="mono muted">${esc(k)}</div>
          ${names.map((n) => `<div>${esc(n)}</div>`).join("")}</div>`).join("") : `<p>None.</p>`}
      </section>
    </div>
    <section class="card" style="margin-top:16px"><h2>All albums</h2>
      <table><thead><tr><th>Album</th><th>Console</th><th>Region</th><th>Chips</th><th>Game key</th></tr></thead><tbody>
      ${c.albums.slice(0, 500).map((a) => `<tr><td>${esc(a.name)}</td><td>${esc(a.platform)}</td><td>${esc(a.region)}</td>
        <td>${esc(a.chips.join(", "))}</td><td class="mono muted">${esc(a.game_key)}</td></tr>`).join("")}
      </tbody></table>${c.albums.length > 500 ? `<p class="muted">Showing 500 of ${c.albums.length}.</p>` : ""}</section>`;
}

const verText = (s) => `v${s.version} · ${s.build?.commit || "local"}`;
function showVersion(s) {
  $("#ver").textContent = verText(s);
  const u = s.update || {}, b = $("#upd");
  b.hidden = !u.available;
  if (u.available) {
    b.textContent = `Update ready: ${u.latest.commit}`;
    b.title = `A newer image is built (${u.latest.commit}${u.latest.title ? ": " + u.latest.title : ""}). `
      + "Restart the app in TrueNAS to get it.";
  }
}
async function refreshVersion() {
  try { showVersion(await api("status")); } catch (e) { /* offline */ }
}
refreshVersion();
setInterval(() => { if (!document.hidden) refreshVersion(); }, 60000);
api("settings").then((s) => document.body.classList.toggle("covers-whole", s.covers.shape === "original")).catch(() => {});
restoreQueue();
route();
loadDevices();
</script>
</body>
