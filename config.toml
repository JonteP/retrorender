# retrorender settings. Edit and restart the container.

library = "/library"
# Writable folder for album.toml files (titles, order, loops). Generated automatically.
meta_dir = "/meta"
# Backups of album.toml (made on regeneration) are kept in /meta/.backup for this many days
meta_backup_days = 90
# A game whose audio is split over sub-folders (e.g. Stream/ and Seqs/, or a synced rip's
# folder and its Seqs/) is shown as one album with one part per folder.
merge_parts = true
port = 8090
sample_rate = 44100

[engines]
vgmstream_cli = "vgmstream-cli"
sidplayfp_cli = "sidplayfp"
vgm2wav_cli = "vgm2wav"
# Arguments for vgm2wav. {in} = file, {loops} = loop count, {rate} = sample rate.
# If the flags don't match your version, compare with vgm2wav_help in /health and edit here.
vgm2wav_args = ["--loops={loops}", "--samplerate={rate}", "{in}", "-"]
# Engine for VGM/VGZ: "auto" = libgme for Sega-only files, libvgm for the rest.
# "libvgm" = libvgm for all VGM files, "gme" = libgme for all.
vgm_engine = "auto"
# Sequenced GameCube/Wii music (.bms, e.g. Super Mario Galaxy): how much of the game's
# echo/reverb to add. The game sets this per level, not per song; 0 = dry.
jaudio_fx_send = 0.35
# HVSC song length database for SID (in HVSC under DOCUMENTS/)
songlengths = "/library/C64/HVSC/DOCUMENTS/Songlengths.md5"
# STIL.txt (subtune names) is found automatically next to Songlengths; otherwise set:
# stil = "/library/C64/HVSC/DOCUMENTS/STIL.txt"
# xSF (PSF, PSF2, SSF, DSF, USF, GSF, 2SF) is played by xsfplay. PS1/PS2 need Sony's BIOS:
# put hebios.bin or a PS2 BIOS dump (4 MB, e.g. SCPH-39001) in <meta_dir>/bios/, or set:
# psx_bios = "/meta/bios/scph39001.bin"
# PS1/PS2 DMA timing: "friendly" = what PSF players use and rips are tested with,
# "harsh" = delayed DMA interrupts as on the hardware (can break rips)
psx_dma = "friendly"
# Nintendo DS: DeSmuME's interpreter is exact; its JIT is faster on slow CPUs
xsf_ds_jit = false

# Display names for consoles (shown as genre in MA). Key = folder name in the library.
# An album can override this with platform = "..." in its album.toml.
[platforms]
MegaDrive = "Sega Mega Drive"
X68000 = "Sharp X68000"
Wii = "Nintendo Wii"
GameCube = "Nintendo GameCube"
NES = "Nintendo NES"
SNES = "Super Nintendo"
GameBoy = "Nintendo Game Boy"
C64 = "Commodore 64"
Amiga = "Commodore Amiga"
ZXSpectrum = "ZX Spectrum"
PCEngine = "NEC PC Engine"
MSX = "MSX"

# Applies to all tracks unless something more specific says otherwise.
[defaults]
loops = 2          # number of times the loop is played
min_s = 30         # looping tracks play at least this long
max_s = 600        # no track plays longer than this
default_s = 180    # when the length is completely unknown
fade_s = 8         # fade-out when a track is cut

# Per engine
[engine.openmpt]
loops = 1          # tracker modules: one play-through is usually enough

[engine.sidplay]
default_s = 240

# Per file extension (overrides engine)
[ext.spc]
loops = 2
fade_s = 10

[ext.nsf]
default_s = 150

# Subsonic API for Music Assistant's OpenSubsonic provider (and Subsonic apps)
[subsonic]
enabled = true
user = "musicassistant"
password = "byt-mig"
rescan_minutes = 60     # how often the library is re-indexed

# Downloads from joshw.info. The Settings page (Online libraries) overrides enabled,
# systems and temp_limit_gb. Requires /library/_synced to be writable.
[joshw]
enabled = false
systems = ["wii", "gcn", "nsf"]   # subdomains of joshw.info, e.g. spc, smd, usf, psf, gbs
refresh_hours = 24                # re-read each system's list at most this often
delay_s = 2                       # pause between requests (the site is run by volunteers)
temp_limit_gb = 20                # temporary downloads above this are removed, least recently played first

# Console names for joshw systems (shown as genre in MA); defaults exist for common systems
# [joshw.platforms]
# wii = "Nintendo Wii"

[outputs]
# Play on Chromecast and DLNA/UPnP devices (TVs, network speakers) from the web UI.
enabled = true
# Find devices automatically (needs network_mode: host for the container).
discover = true
rediscover_minutes = 10
# Devices to add by hand, e.g. when discovery cannot reach them:
# cast = ["192.168.1.50"]                                  # Chromecast IP (or "ip:port")
# dlna = ["http://192.168.1.60:1400/description.xml"]      # renderer description URL
# Address devices use to fetch the audio; empty = worked out per device.
# base_url = "http://192.168.1.126:8090"
# Stream format: "auto" (FLAC where supported, else WAV/MP3), "flac", "wav" or "mp3".
format = "auto"

[updates]
# Show "Update ready" in the web UI when GitHub has built a newer image than the one
# running (asks the GitHub API every few minutes; restart the app to update).
check = true
interval_minutes = 5
